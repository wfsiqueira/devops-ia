apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-chatbot-sa
  namespace: k8s-chatbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-chatbot-reader
rules:
- apiGroups: [ "" ]
  resources:
  - pods
  - services
  - nodes
  - namespaces
  - events
  - configmaps
  - persistentvolumeclaims
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "" ]
  resources:
  - pods/log
  verbs: [ "get", "list" ]
- apiGroups: [ "apps" ]
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "batch" ]
  resources:
  - jobs
  - cronjobs
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "networking.k8s.io" ]
  resources:
  - ingresses
  - networkpolicies
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "metrics.k8s.io" ]
  resources:
  - pods
  - nodes
  verbs: [ "get", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-chatbot-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-chatbot-reader
subjects:
- kind: ServiceAccount
  name: k8s-chatbot-sa
  namespace: k8s-chatbot
